<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPilot</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow-x:hidden}body{width:360px;background:#fff}
.ph{background:#15181E;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.ph b{font-size:16px}
.ph label{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:#C9CED7}
.pb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.next{background:#F4F6FC;border:1px solid #DCE3F7;border-radius:10px;padding:12px}
.next .v{font:600 26px Consolas,monospace}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.trio div{border:1px solid #E1E4E9;border-radius:8px;padding:8px 4px}
.trio b{display:block;font:600 20px Consolas,monospace}
.trio span{font-size:12px;color:#5B6270}
.site{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #EDEFF2;font-size:13px}
.site:last-child{border-bottom:0}
.ok{font-size:12px;font-weight:600;color:#1E5E38;background:#E3F3E9;padding:2px 8px;border-radius:999px}
.bad{font-size:12px;font-weight:600;color:#8A3B00;background:#FFF3E6;padding:2px 8px;border-radius:999px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.off{font-size:12px;color:#5B6270}
.full{width:100%;min-height:42px}
</style>
</head>
<body>
<div class="ph">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7FA0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l7-7 2 6 6 2-7 7-2-6z"/></svg>
  <b>JobPilot</b>
  <label>Auto-scan <input type="checkbox" id="enabled"></label>
</div>
<div class="pb">
  <div class="next"><div class="co" id="nextL">Next scan</div><div class="v" id="next">—</div><div class="co" id="nextSub"></div></div>
  <div class="trio">
    <div><b id="cNew" style="color:#2347C6">0</b><span>New</span></div>
    <div><b id="cStarted" style="color:#8A5A00">0</b><span>Unfinished</span></div>
    <div><b id="cApplied" style="color:#1E7A46">0</b><span>Applied today</span></div>
  </div>
  <div><div class="lab">Sites</div><div id="sites"></div></div>
  <button class="btn primary full" id="open">Open dashboard</button>
  <div style="display:flex;gap:8px">
    <button class="btn full" id="scan">Scan now</button>
    <button class="btn full" id="fill">Fill this page</button>
  </div>
  <div class="co" id="msg" role="status"></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
